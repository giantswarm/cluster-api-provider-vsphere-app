# Upstream v1.15.3 renamed the controller ServiceAccount to `capv-manager`, but
# patches/sa.yaml plus the role-binding patches keep us on
# `capv-controller-manager`. Drop the upstream one so we do not ship an unused
# ServiceAccount.
---
$patch: delete
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capv-manager
  namespace: capv-system
